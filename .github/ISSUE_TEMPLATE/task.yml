name: Task
description: New task
title: "T-XXX: "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        Branch from `dev`: `feat/T-XXX-name`. PR open to `dev`.
  - type: textarea
    id: description
    attributes:
      label: What need to do?
      description: Shortly, 1–3 sentences
    validations:
      required: true
  - type: textarea
    id: todo
    attributes:
      label: Checklist
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: How to check
      description: Comands or steps
      render: bash
  - type: input
    id: depends_on
    attributes:
      label: Depends on
      placeholder: T-006

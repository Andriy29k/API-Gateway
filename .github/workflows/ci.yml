name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [service-a, service-b, service-c, service-d]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/requirements-dev.txt
            services/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: pip install -r services/requirements-dev.txt -r services/${{ matrix.service }}/requirements.txt

      - name: Run unit tests
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -v

  smoke-tests:
    name: Gateway smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: Validate NGINX configuration
        run: docker compose exec -T gateway nginx -t

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest smoke tests
        run: python -m pytest tests/smoke -v

      - name: Run bash smoke test
        run: bash scripts/smoke-test.sh

      - name: Show container status and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v

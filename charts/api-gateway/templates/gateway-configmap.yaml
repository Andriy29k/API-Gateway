{{- /*
Kubernetes version of gateway/nginx.conf and gateway/conf.d/routes.conf.
Differences from Compose:
  - upstreams and /api/<service>/ routes are generated from .Values.services (disabled services get no route);
  - the client IP is taken from X-Forwarded-For set by Traefik (real_ip), so rate limits work per client;
  - X-Forwarded-Proto is passed on from Traefik (TLS ends there).
Keep the rest in sync with gateway/.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
data:
  nginx.conf: |
    worker_processes auto;

    events {
        worker_connections 1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format gateway_json escape=json
            '{"time":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"request_time":$request_time,'
            '"upstream_status":"$upstream_status",'
            '"upstream_response_time":"$upstream_response_time"}';

        access_log /dev/stdout gateway_json;
        error_log /dev/stderr warn;

        sendfile on;
        keepalive_timeout 15;
        client_max_body_size 1m;
        client_body_timeout 10s;
        client_header_timeout 10s;
        send_timeout 15s;

        {{- range .Values.gateway.trustedProxies }}
        set_real_ip_from {{ . }};
        {{- end }}
        real_ip_header X-Forwarded-For;

        map $http_x_forwarded_proto $forwarded_proto {
            default $http_x_forwarded_proto;
            ""      $scheme;
        }

        limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;
        limit_req_zone $binary_remote_addr zone=faults_limit:10m rate=2r/s;

        limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
        {{- range $name, $svc := .Values.services }}
        {{- if $svc.enabled }}

        upstream {{ include "api-gateway.upstream" $name }} {
            server {{ $name }}:8000;
            keepalive 16;
        }
        {{- end }}
        {{- end }}

        include /etc/nginx/conf.d/default.conf;
    }

  default.conf: |
    {{- if .Values.gateway.metrics.enabled }}
    # Connection and request counters for the nginx-prometheus-exporter sidecar.
    # Listens on localhost only, so it is not reachable from outside the pod.
    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }

    {{- end }}
    server {
        listen 8080;
        server_name _;

        absolute_redirect off;

        add_header X-Request-ID $request_id always;

        limit_req_status 429;
        limit_conn_status 429;
        limit_conn conn_per_ip 20;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_hide_header X-Request-ID;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;

        error_page 502 @bad_gateway;
        error_page 503 @service_unavailable;
        error_page 504 @gateway_timeout;
        error_page 429 @too_many_requests;
        error_page 413 @payload_too_large;

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":"payload_too_large","status":413,"request_id":"$request_id"}';
        }

        location @too_many_requests {
            add_header X-Request-ID $request_id always;
            add_header Retry-After 1 always;
            default_type application/json;
            return 429 '{"error":"too_many_requests","status":429,"request_id":"$request_id"}';
        }

        location @bad_gateway {
            default_type application/json;
            return 502 '{"error":"bad_gateway","status":502,"request_id":"$request_id"}';
        }

        location @service_unavailable {
            default_type application/json;
            return 503 '{"error":"service_unavailable","status":503,"request_id":"$request_id"}';
        }

        location @gateway_timeout {
            default_type application/json;
            return 504 '{"error":"gateway_timeout","status":504,"request_id":"$request_id"}';
        }

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"api-gateway","request_id":"$request_id"}';
        }
        {{- range $name, $svc := .Values.services }}
        {{- if $svc.enabled }}

        location = /api/{{ $name }} {
            return 308 /api/{{ $name }}/$is_args$args;
        }

        location ^~ /api/{{ $name }}/ {
            limit_req {{ $svc.limitReq }};
            proxy_pass http://{{ include "api-gateway.upstream" $name }}/;
        }
        {{- end }}
        {{- end }}

        location / {
            default_type application/json;
            return 404 '{"error":"not_found","request_id":"$request_id"}';
        }
    }

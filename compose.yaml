x-service: &service
  restart: unless-stopped
  networks:
    - app-net

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/conf.d/routes.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      service-a:
        condition: service_healthy
      service-b:
        condition: service_healthy
      service-c:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      # Checks that the gateway actually answers, not only that its config parses.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  service-a:
    <<: *service
    build:
      context: ./services/service-a
    expose:
      - "8000"

  service-b:
    <<: *service
    build:
      context: ./services/service-b
    expose:
      - "8000"

  service-c:
    <<: *service
    build:
      context: ./services/service-c
    expose:
      - "8000"

networks:
  app-net:
    driver: bridge

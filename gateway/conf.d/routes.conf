server {
    listen 8080;
    server_name _;

    absolute_redirect off;

    add_header X-Request-ID $request_id always;

   limit_req_status 429;
    limit_conn_status 429;
    limit_conn conn_per_ip 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";          # required for upstream keepalive
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

     error_page 502 @bad_gateway;
    error_page 503 @service_unavailable;
    error_page 504 @gateway_timeout;
    error_page 429 @too_many_requests;

    location @too_many_requests {
        add_header X-Request-ID $request_id always;
        add_header Retry-After 1 always;
        default_type application/json;
        return 429 '{"error":"too_many_requests","status":429,"request_id":"$request_id"}';
    }

    location @bad_gateway {
        default_type application/json;
        return 502 '{"error":"bad_gateway","status":502,"request_id":"$request_id"}';
    }

    location @service_unavailable {
        default_type application/json;
        return 503 '{"error":"service_unavailable","status":503,"request_id":"$request_id"}';
    }

    location @gateway_timeout {
        default_type application/json;
        return 504 '{"error":"gateway_timeout","status":504,"request_id":"$request_id"}';
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway","request_id":"$request_id"}';
    }

    # /api/service-X/<path> -> service-X:8000/<path> (the prefix is removed).

    location = /api/service-a {
        return 308 /api/service-a/$is_args$args;
    }

    location ^~ /api/service-a/ {
        limit_req zone=api_limit burst=10 delay=5;
        proxy_pass http://service_a_upstream/;
    }

    location = /api/service-b {
        return 308 /api/service-b/$is_args$args;
    }

    location ^~ /api/service-b/ {
        limit_req zone=api_limit burst=10 delay=5;
        proxy_pass http://service_b_upstream/;
    }

    location = /api/service-c {
        return 308 /api/service-c/$is_args$args;
    }

    location ^~ /api/service-c/ {
        limit_req zone=api_limit burst=10 delay=5;
        proxy_pass http://service_c_upstream/;
    }

    location = /api/service-d {
        return 308 /api/service-d/$is_args$args;
    }

    location ^~ /api/service-d/ {
        limit_req zone=faults_limit burst=5 nodelay;
        proxy_pass http://service_d_upstream/;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","request_id":"$request_id"}';
    }
}

server {
    listen 8080;
    server_name _;

    # The gateway port inside the container differs from the published host port,
    # so redirects must be relative.
    absolute_redirect off;

    # One request ID per request. Upstream copies of this header are dropped below,
    # so the client always receives exactly one.
    add_header X-Request-ID $request_id always;

    limit_req_status 429;

    # Proxy settings shared by every location below. They are inherited because
    # the locations define no proxy_* directives of their own.
    proxy_http_version 1.1;
    proxy_set_header Connection "";          # required for upstream keepalive
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header X-Request-ID;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway","request_id":"$request_id"}';
    }

    # /api/service-X/<path> -> service-X:8000/<path> (the prefix is removed).

    location = /api/service-a {
        return 308 /api/service-a/$is_args$args;
    }

    location ^~ /api/service-a/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://service_a_upstream/;
    }

    location = /api/service-b {
        return 308 /api/service-b/$is_args$args;
    }

    location ^~ /api/service-b/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://service_b_upstream/;
    }

    location = /api/service-c {
        return 308 /api/service-c/$is_args$args;
    }

    location ^~ /api/service-c/ {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass http://service_c_upstream/;
    }

    location / {
        default_type application/json;
        return 404 '{"error":"not_found","request_id":"$request_id"}';
    }
}

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format gateway_json escape=json
        '{"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_time":$request_time,'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /dev/stdout gateway_json;
    error_log /dev/stderr warn;

    sendfile on;
    keepalive_timeout 15;
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 15s;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=5r/s;

    upstream service_a_upstream {
        server service-a:8000;
        keepalive 16;
    }

    upstream service_b_upstream {
        server service-b:8000;
        keepalive 16;
    }

    upstream service_c_upstream {
        server service-c:8000;
        keepalive 16;
    }

    include /etc/nginx/conf.d/default.conf;
}

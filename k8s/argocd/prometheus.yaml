# Prometheus (community chart) in the monitoring namespace, managed by Argo CD (T-022).
# Collects: kubelet/cAdvisor (CPU, RAM per container), kube-state-metrics (restarts, CrashLoopBackOff),
# node-exporter (VM), and every pod with prometheus.io/scrape annotations (Traefik, NGINX exporter).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 31.0.0
    helm:
      releaseName: prometheus
      valuesObject:
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        kube-state-metrics:
          enabled: true
        prometheus-node-exporter:
          enabled: true
        scrapeConfigs:
          prometheus-pushgateway:
            enabled: false
        server:
          retention: 7d
          retentionSize: 4GB
          persistentVolume:
            enabled: true
            size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
        # Alerting rules (T-041). No Alertmanager: firing alerts are visible in the Prometheus UI
        # (Alerts) and in Grafana (ALERTS metric on the API Gateway dashboard).
        serverFiles:
          alerting_rules.yml:
            groups:
              - name: kubernetes
                rules:
                  - alert: ContainerCrashLooping
                    # On Kubernetes 1.37 there is no CrashLoopBackOff waiting reason (see k8s/argocd/README.md).
                    expr: >-
                      (increase(kube_pod_container_status_restarts_total[15m]) > 2)
                      and on (namespace, pod, container) (kube_pod_container_status_ready == 0)
                    for: 2m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} is crash looping"
                      description: "{{ $value | humanize }} restarts in 15 minutes and the container is not ready."
                  - alert: PodNotReady
                    expr: >-
                      kube_pod_status_ready{condition="false"}
                      * on (namespace, pod) group_left () (kube_pod_status_phase{phase="Running"} == 1) > 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready for 5 minutes"
                  - alert: TargetDown
                    expr: up == 0
                    for: 5m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Scrape target {{ $labels.instance }} (job {{ $labels.job }}) is down"
              - name: node
                rules:
                  - alert: NodeMemoryHigh
                    expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.9
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Node {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }}"
                  - alert: NodeDiskAlmostFull
                    expr: >-
                      1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} > 0.85
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Root disk of {{ $labels.instance }} is {{ $value | humanizePercentage }} full"
              - name: api-gateway
                rules:
                  - alert: GatewayHigh5xxRatio
                    expr: >-
                      sum(rate(traefik_service_requests_total{service=~"api-gateway-gateway.*", code=~"5.."}[5m]))
                      / sum(rate(traefik_service_requests_total{service=~"api-gateway-gateway.*"}[5m])) > 0.05
                    for: 5m
                    labels:
                      severity: critical
                    annotations:
                      summary: "More than 5% of gateway responses are 5xx ({{ $value | humanizePercentage }})"
                  - alert: GatewayRateLimiting
                    expr: >-
                      sum(rate(traefik_service_requests_total{service=~"api-gateway-gateway.*", code="429"}[2m])) > 1
                    for: 2m
                    labels:
                      severity: info
                    annotations:
                      summary: "Gateway rejects {{ $value | humanize }} requests/s with 429"
                  - alert: GatewayHighLatency
                    expr: >-
                      histogram_quantile(0.95, sum by (le)
                      (rate(traefik_service_request_duration_seconds_bucket{service=~"api-gateway-gateway.*"}[5m]))) > 1
                    for: 10m
                    labels:
                      severity: warning
                    annotations:
                      summary: "Gateway p95 response time is {{ $value | humanizeDuration }}"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

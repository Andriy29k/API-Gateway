# Overrides values of the Traefik chart bundled with k3s.
# Apply only after the production certificate works (TERRAFORM.md, section 7).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
